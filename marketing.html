    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Was kostet Omlify?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Aktuell nichts. Omlify ist im Aufbau, und solange das so ist, zahlst du nichts. Wenn ein Preis kommt, erfährst du ihn mindestens zwei Monate vorher."
            }
          },
          {
            "@type": "Question",
            "name": "Nimmt Omlify eine Provision auf meine Buchungen?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nein, es gibt kein Provisionsmodell. Omlify verdient später an deinem Zugang zur Software, nicht an dem, was deine Teilnehmer bezahlen. Sobald es Online-Zahlungen gibt, fallen die Gebühren deines Zahlungsanbieters an — die gehen an ihn, nicht an uns."
            }
          },
          {
            "@type": "Question",
            "name": "Wo liegen meine Daten, und ist das DSGVO-konform?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Deine Daten liegen in der EU, konkret in Irland. Jedes Studio hat seine eigene, getrennte Umgebung — kein Studio kann die Daten eines anderen sehen."
            }
          },
          {
            "@type": "Question",
            "name": "Brauche ich technische Kenntnisse?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Nein. Du legst dein Studio an, wählst einen Namen für deine Adresse und lädst dein Logo hoch. Alles Weitere sind Kurse, Termine und Teilnehmer."
            }
          },
          {
            "@type": "Question",
            "name": "Kann ich von Eversports oder Momoyoga wechseln?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Einen automatischen Import gibt es noch nicht. Schreib uns, wenn du wechseln willst — bei den ersten Studios machen wir den Umzug persönlich mit dir."
            }
          },
          {
            "@type": "Question",
            "name": "Können meine Teilnehmerinnen online bezahlen?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Noch nicht. Online-Zahlungen sind das, woran wir gerade arbeiten. Heute rechnest du ab wie bisher, Omlify zeigt dir zuverlässig, wer angemeldet ist."
            }
          },
          {
            "@type": "Question",
            "name": "Lohnt sich das, wenn ich nur zwei Kurse pro Woche gebe?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ja. Omlify ist für selbstständige Lehrerinnen genauso gebaut wie für Studios. Du siehst nur das, was du brauchst."
            }
          },
          {
            "@type": "Question",
            "name": "Was passiert mit meinen Daten, wenn ich aufhöre?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Deine Teilnehmerliste mit allen Anmeldungen lädst du jederzeit selbst als CSV-Datei herunter. Für alles Weitere schreib uns — du bekommst deine Daten und wir löschen sie."
            }
          },
          {
            "@type": "Question",
            "name": "Wer steckt hinter Omlify?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Hinter Omlify stehen zwei Leute: Julius entwickelt das Produkt, André begleitet es beratend. Wir bauen Omlify mit den Studios, die es benutzen — bei jeder Frage erreichst du uns direkt unter support@omlify.de, kein Ticketsystem."
            }
          }
        ]
