# Taegliches verschluesseltes Backup der PROD-Datenbank nach Cloudflare R2.
#
# Warum es das gibt: Das PROD-Projekt laeuft auf dem Supabase-Free-Plan und hat damit
# KEINE automatischen Backups und kein Point-in-Time-Recovery. Ohne diesen Job waere
# ein Datenverlust endgueltig.
#
# Wiederherstellung: siehe docs/BACKUP_RESTORE.md
#
# Benoetigte Repository-Secrets (Settings -> Secrets and variables -> Actions):
#   PROD_REF              Projekt-Ref, z. B. otnhxzomnjjthocovasu
#   PROD_DB_HOST          Pooler-Praefix, z. B. aws-1-eu-west-1
#   PROD_DB_PASSWORD      Datenbank-Passwort im Klartext (wird hier URL-kodiert)
#   BACKUP_PASSPHRASE     Passwort zum Ver- und Entschluesseln der Sicherung
#   R2_ACCOUNT_ID         Cloudflare-Account-ID
#   R2_ACCESS_KEY_ID      R2-Token, Access Key ID
#   R2_SECRET_ACCESS_KEY  R2-Token, Secret Access Key
#   R2_BUCKET             Name des Buckets, z. B. omlify-backups

name: PROD-Backup

on:
  schedule:
    - cron: "0 3 * * *"   # taeglich 03:00 UTC
  workflow_dispatch:       # erlaubt manuelles Ausloesen ueber die Actions-Oberflaeche

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Supabase-CLI installieren
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verbindungsdaten zusammensetzen
        id: conn
        env:
          REF: ${{ secrets.PROD_REF }}
          HOST: ${{ secrets.PROD_DB_HOST }}
          PW: ${{ secrets.PROD_DB_PASSWORD }}
        run: |
          if [ -z "$REF" ] || [ -z "$HOST" ] || [ -z "$PW" ]; then
            echo "::error::PROD_REF, PROD_DB_HOST oder PROD_DB_PASSWORD fehlt in den Secrets."
            exit 1
          fi
          # Passwort URL-kodieren, sonst zerlegen Sonderzeichen wie # und + die URL
          ENC=$(node -e 'process.stdout.write(encodeURIComponent(process.env.PW))')
          URL="postgresql://postgres.${REF}:${ENC}@${HOST}.pooler.supabase.com:5432/postgres"
          echo "::add-mask::$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Datenbank sichern
        env:
          DB_URL: ${{ steps.conn.outputs.url }}
        run: |
          set -euo pipefail
          mkdir -p backup
          echo "Rollen..."; supabase db dump --db-url "$DB_URL" -f backup/roles.sql  --role-only
          echo "Schema..."; supabase db dump --db-url "$DB_URL" -f backup/schema.sql
          echo "Daten...";  supabase db dump --db-url "$DB_URL" -f backup/data.sql --use-copy --data-only

      - name: Sicherung auf Plausibilitaet pruefen
        run: |
          set -uo pipefail
          fail=0

          echo "== Groessen =="
          for f in roles schema data; do
            size=$(wc -c < "backup/$f.sql")
            echo "  $f.sql: $size Bytes"
          done

          # roles.sql ist bei Supabase legitim winzig: die meisten Rollen verwaltet
          # der Anbieter und dumpt sie nicht mit. Nur auf "existiert" pruefen.
          [ -s backup/roles.sql ] || { echo "::error::backup/roles.sql ist leer."; fail=1; }

          # Schwellen an den beobachteten Groessen ausgerichtet (Schema ~76 KB, Daten ~1,7 MB)
          schema_size=$(wc -c < backup/schema.sql)
          data_size=$(wc -c < backup/data.sql)
          [ "$schema_size" -ge 10000 ] || { echo "::error::schema.sql nur $schema_size Bytes - kein vollstaendiges Schema."; fail=1; }
          [ "$data_size"   -ge 10000 ] || { echo "::error::data.sql nur $data_size Bytes - Datendump praktisch leer."; fail=1; }

          echo
          echo "== Tabellen im Datendump =="
          # pg_dump schreibt COPY "public"."tenants" (...) - Anfuehrungszeichen sind optional,
          # deshalb im Muster beides zulassen.
          grep -oE '^COPY "?[a-z_0-9]+"?\."?[a-zA-Z_0-9]+"?' backup/data.sql             | sed -E 's/^COPY //; s/"//g' | sort | sed 's/^/  /' || true

          echo
          echo "== Pflichttabellen =="
          for t in tenants users courses registrations; do
            if grep -qE "^COPY \"?public\"?\.\"?${t}\"? " backup/data.sql; then
              echo "  public.$t: vorhanden"
            else
              echo "::error::Tabelle 'public.$t' fehlt im Datendump - Sicherung unvollstaendig."
              fail=1
            fi
          done

          if grep -qE "^COPY \"?auth\"?\.\"?users\"? " backup/data.sql; then
            echo "  auth.users: vorhanden"
          else
            echo "::error::auth.users fehlt im Datendump. Ohne Auth-Nutzer kann sich nach einer Wiederherstellung niemand anmelden - eine Sicherung ohne sie ist wertlos. Siehe docs/BACKUP_RESTORE.md."
            fail=1
          fi

          exit $fail

      - name: Packen und verschluesseln
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE fehlt - es wird nichts Unverschluesseltes hochgeladen."
            exit 1
          fi
          STAMP=$(date -u +%Y-%m-%dT%H-%M-%SZ)
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          tar -czf "omlify-prod-$STAMP.tar.gz" -C backup .
          gpg --batch --yes --symmetric --cipher-algo AES256 \
              --passphrase "$PASSPHRASE" \
              -o "omlify-prod-$STAMP.tar.gz.gpg" \
              "omlify-prod-$STAMP.tar.gz"
          rm -f "omlify-prod-$STAMP.tar.gz"
          ls -lh "omlify-prod-$STAMP.tar.gz.gpg"

      - name: Nach Cloudflare R2 hochladen
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          aws s3 cp "omlify-prod-$STAMP.tar.gz.gpg" \
            "s3://$BUCKET/prod/omlify-prod-$STAMP.tar.gz.gpg" \
            --endpoint-url "https://$ACCOUNT.r2.cloudflarestorage.com" \
            --checksum-algorithm CRC32
          echo "Hochgeladen: prod/omlify-prod-$STAMP.tar.gz.gpg"

          # Der CLI nicht glauben, sondern zurueckfragen: liegt das Objekt wirklich
          # im Bucket, und ist es so gross wie die Datei, die wir geschickt haben?
          KEY="prod/omlify-prod-$STAMP.tar.gz.gpg"
          LOKAL=$(wc -c < "omlify-prod-$STAMP.tar.gz.gpg")
          REMOTE=$(aws s3api head-object             --bucket "$BUCKET" --key "$KEY"             --endpoint-url "https://$ACCOUNT.r2.cloudflarestorage.com"             --query ContentLength --output text 2>&1) || {
              echo "::error::Das hochgeladene Objekt ist im Bucket nicht auffindbar. Antwort: $REMOTE"
              exit 1
            }
          echo "Im Bucket bestaetigt: $KEY ($REMOTE Bytes, lokal $LOKAL Bytes)"
          if [ "$REMOTE" != "$LOKAL" ]; then
            echo "::error::Groesse im Bucket ($REMOTE) weicht von der hochgeladenen Datei ($LOKAL) ab."
            exit 1
          fi

          echo
          echo "== Aktuell im Bucket =="
          aws s3 ls "s3://$BUCKET/prod/"             --endpoint-url "https://$ACCOUNT.r2.cloudflarestorage.com" | tail -10

      - name: Unverschluesselte Reste entfernen
        if: always()
        run: rm -rf backup *.tar.gz
