#
# Wrangler bevorzugt wrangler.jsonc gegenueber wrangler.toml. Solange wrangler.jsonc
# existiert, wird hier nichts gelesen. Nachgewiesen mit `npx wrangler deploy --dry-run`:
#
#   Using redirected Wrangler configuration.
#    - Configuration being used: "dist/wrangler.json"
#    - Original user's configuration: "wrangler.jsonc"
#
# Die echte Konfiguration steht in wrangler.jsonc; @cloudflare/vite-plugin erzeugt daraus
# beim Build dist/wrangler.json, und genau die benutzt der Deploy.
#
# Die Datei bleibt nur als Wegweiser stehen, weil sie frueher autoritativ klingende
# Kommentare zu Worker-Namen und Branches enthielt, die niemals gewirkt haben.
#
# Aenderungen an der Deploy-Konfiguration gehoeren nach wrangler.jsonc.
