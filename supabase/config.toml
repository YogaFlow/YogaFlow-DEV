# Per-function config: send-email is invoked only by other Edge Functions (request-password-reset, etc.)
# with internal secret header; JWT check is disabled, auth is done via X-Internal-Secret in the function.
[functions.send-email]
verify_jwt = false

# Onboarding vor Sign-up: ruft RPCs nur mit service_role auf (DB erteilt anon kein EXECUTE mehr).
[functions.onboarding-public]
verify_jwt = false

# update-user und delete-user pruefen den Aufrufer SELBST: sie lesen den Authorization-Header,
# aufloesen den Nutzer ueber auth.getUser() und verlangen die Rolle owner/admin/teacher.
# Bisher stand verify_jwt=false nur als --no-verify-jwt im Deploy-Kommando in package.json.
# Damit haette ein Sammel-Deploy ("supabase functions deploy" ohne Namen) die JWT-Pruefung
# wieder eingeschaltet und beide Funktionen lahmgelegt. Hier festgeschrieben, damit DEV und
# PROD reproduzierbar denselben Stand bekommen.
[functions.update-user]
verify_jwt = false

[functions.delete-user]
verify_jwt = false

# service-ping prüft JWT und Tenant selbst über initService (klare Codes:
# missing_authorization, invalid_token, missing_tenant, invalid_tenant).
# Gateway-verify_jwt=true würde fehlende Auth mit einem anderen 401-Body
# abfangen und unsere Codes untestbar machen — gleiches Muster wie
# update-user / delete-user.
[functions.service-ping]
verify_jwt = false

# set-participant-password prüft JWT und Tenant selbst über initService
# (klare Codes: missing_authorization, invalid_token, missing_tenant, invalid_tenant).
# Gateway-verify_jwt=true würde fehlende Auth mit einem anderen 401-Body
# abfangen und unsere Codes untestbar machen — gleiches Muster wie service-ping.
[functions.set-participant-password]
verify_jwt = false

# payments-webhook (Geldkette 1.4): Stripe sendet kein JWT. Geprueft wird die
# Signatur (STRIPE_WEBHOOK_SECRET, optional STRIPE_WEBHOOK_SECRET_2) in der Function.
[functions.payments-webhook]
verify_jwt = false

# payments-onboarding (Geldkette 1.3a) prueft JWT und Tenant selbst ueber initService
# (klare Codes: missing_authorization, invalid_token, missing_tenant, invalid_tenant).
# Gateway-verify_jwt=true wuerde fehlende Auth mit einem anderen 401-Body
# abfangen und unsere Codes untestbar machen — gleiches Muster wie service-ping.
[functions.payments-onboarding]
verify_jwt = false

# payments-checkout (Geldkette 2.2a-3) prueft JWT und Tenant selbst ueber initService
# (klare Codes). Gateway-verify_jwt=true wuerde fehlende Auth mit einem anderen
# 401-Body abfangen — gleiches Muster wie payments-onboarding.
[functions.payments-checkout]
verify_jwt = false

# dispatch-emails (2.1b-b B2): Aufruf nur mit X-Email-Dispatch-Secret aus dem Vault/Cron.
# Gateway-JWT wäre unsinnig (pg_net hat kein Nutzer-JWT).
[functions.dispatch-emails]
verify_jwt = false

# payments-jobs (2.2a-4b): Aufruf nur mit Authorization Bearer = PROVIDER_JOBS_SECRET
# (Vault provider_jobs_secret / Cron pg_net). Gateway-JWT wäre unsinnig.
[functions.payments-jobs]
verify_jwt = false

# ops-monitor (B2): Authorization Bearer = OPS_MONITOR_SECRET (Vault ops_monitor_secret).
[functions.ops-monitor]
verify_jwt = false
